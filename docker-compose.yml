services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mecaup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mecaup_password}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api/app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mecaup:mecaup_password@mongodb:27017/mecaup?authSource=admin}
      MONGODB_DB: ${MONGODB_DB:-mecaup}
      CARIMAGES_API_KEY: ${CARIMAGES_API_KEY:-}
      CARIMAGES_BASE_URL: ${CARIMAGES_BASE_URL:-https://carimagesapi.com}
    volumes:
      - ./api/app/static:/app/static
    ports:
      - "8001:8000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8001}
    ports:
      - "80:3000"

volumes:
  mongodb_data:
